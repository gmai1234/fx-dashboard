name: Update FX Data

# Runs twice daily to refresh fx_data.js with the latest FRED FX observations.
#  - 23:00 UTC = 08:00 KST (after US market close)
#  - 11:00 UTC = 20:00 KST (US mid-day)
# Same schedule as macro/sentiment dashboards for time alignment.
on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fx-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch FX data and rebuild fx_data.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collect_data.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet fx_data.js; then
            echo "No changes to fx_data.js — skipping commit."
            exit 0
          fi
          TS=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          git add fx_data.js
          git commit -m "chore: update FX data (${TS})"
          git push
